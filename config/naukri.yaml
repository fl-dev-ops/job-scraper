experience_filter: "0,2" # Naukri URL param range

# Selectors used ONLY for navigation and JD text extraction.
# Field values (title, company, salary, etc.) are extracted by the LLM — not by CSS.
selectors:
  job_cards: "article.jobTuple" # listing page: identifies each job card
  job_link: "a.title" # href to JD detail page (within each card)
  jd_body: "section[class*='job-desc-container']" # JD container → stripped to plain text for LLM
  llm_context_selector:
    - "section[class*='job-header']" # Header context: title, company, exp, salary, location
  pagination_next: "a.pagination-next" # next page button
  # Location span in detail page header (CSS module class; substring match is stable)
  location_selector: "span[class*='location']"

# Extraction / pipeline knobs
parallel_extractions: 5 # max concurrent LLM extraction tasks per query

# Anti-detection knobs
min_delay_seconds: 3
max_delay_seconds: 8
pages_per_session: 10 # restart browser every N pages
headless: false
block_resources: ["image", "font", "media"]
proxy_url: null # override with env NAUKRI_PROXY_URL
