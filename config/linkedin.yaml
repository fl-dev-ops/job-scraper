# LinkedIn scraper configuration (guest / unauthenticated)
# All delays in seconds. Selectors are CSS.

base_url: "https://www.linkedin.com"
# Guest jobs search URL — no login required.
# f_TPR=r2592000 → posted in last 30 days
# f_E=2          → Entry level seniority filter (LinkedIn's own classification)
# LinkedIn's f_E bucket is coarse, so still filter later from extracted JD fields.
# Location is appended in the fetcher; keywords goes via {query} placeholder.
search_url: "https://www.linkedin.com/jobs/search?keywords={query}&location={location}&f_E=2&f_TPR=r2592000&position=1&pageNum=0"

queries:
  - "Fresher jobs"
  - "software engineer"
  - "full stack developer entry level"
  - "backend developer"
  - "MEAN stack developer"
  # - "android developer"
  # - "data engineer"
  # - "devops engineer"
  # - "associate software engineer"

